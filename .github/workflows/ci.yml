name: CI

on:
  push:
    branches: [ "1.0-devel", "master" ]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.cc }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
        mode: [ release, debug ]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          if [ "${{ matrix.mode }}" = "debug" ]; then
            make ndppd CC=${{ matrix.cc }} DEBUG=1
          else
            make ndppd CC=${{ matrix.cc }}
          fi

  unit:
    name: unit tests (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
    steps:
      - uses: actions/checkout@v4
      - run: make check-unit CC=${{ matrix.cc }}

  sanitizers:
    name: unit tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run under AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=0
        run: |
          make check-unit \
            CFLAGS="-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer \
                    -Werror -Wall -Wextra -fno-strict-aliasing -Wno-strict-aliasing \
                    -Wno-missing-braces -Wno-missing-field-initializers \
                    -Wno-address-of-packed-member" \
            TEST_LDFLAGS="-fsanitize=address,undefined"

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow unprivileged user namespaces
        run: |
          # Ubuntu 24.04 gates unprivileged user namespaces behind an
          # AppArmor knob, and the runners have it on. Lift it rather than
          # running the suite as root: needing no root is a property of the
          # harness worth continuing to exercise.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check that unprivileged user namespaces are available
        run: |
          # The suite skips cleanly where they are not, which is right for a
          # developer's machine and wrong for CI -- a skip must not be able
          # to masquerade as a pass here.
          unshare -Urn true
      - run: make check-integration

  freebsd:
    name: build and test (FreeBSD)
    runs-on: ubuntu-latest
    # A FreeBSD VM on a runner with no nested virtualisation runs under
    # QEMU's interpreter, so this job is minutes rather than seconds and
    # occasionally stalls on boot. It is still the only free way to put
    # ndppd's BSD backend in front of a real kernel on every change.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.5'
          # FreeBSD's root shell is csh; the suite is bash and sh.
          usesh: true
          # Nothing produced in the VM is needed back on the runner.
          copyback: false
          prepare: |
            pkg install -y gmake bash python3
          run: |
            set -e
            # The Makefile uses GNU make syntax, which is what issue #66 was
            # really about: on FreeBSD it is gmake, not make.
            gmake ndppd CC=clang
            gmake check-unit CC=clang
            # Unlike the Linux job this runs as root, because a VNET jail
            # and an epair are privileged operations with no unprivileged
            # equivalent. The VM is disposable, which is what makes that
            # acceptable here and nowhere else.
            gmake check-integration CC=clang
